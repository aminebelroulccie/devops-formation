# Pipeline d'intégration continue — Formini Tasks
#
# Déclenché à chaque pull request et à chaque push sur main.
#   test  : lint + tests unitaires (toujours)
#   build : image Docker → scan trivy → publication (push sur main seulement)
#
# Le runner est en mode HOST (étiquette ubuntu-latest:host) : python3, docker,
# trivy et node sont installés sur la VM. On n'utilise donc ni setup-python ni
# docker/login-action : de simples commandes shell, rejouables à la main.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: gitea.formini.local:3000
  IMAGE: gitea.formini.local:3000/equipe-a/formini-tasks

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements-dev.txt

      - name: Lint
        run: .venv/bin/flake8 .

      - name: Tests
        run: .venv/bin/pytest -q --junitxml=report.xml

      # Bonus : audit des dépendances contre les bases de vulnérabilités.
      - name: Audit des dépendances
        run: |
          .venv/bin/pip install -q pip-audit
          .venv/bin/pip-audit -r requirements.txt

      # Bonus : rapport téléchargeable depuis la page du run, même en cas d'échec.
      - name: Rapport de tests
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: rapport-tests
          path: report.xml

  build:
    runs-on: ubuntu-latest
    needs: test
    if: gitea.event_name == 'push'
    # Scan et publication sont des steps de CE job, pas des jobs séparés :
    # en mode host, un autre job pourrait être pris par le runner d'une autre VM,
    # qui n'aurait pas l'image fraîchement construite dans son démon Docker.
    steps:
      - uses: actions/checkout@v4

      - name: Étiquette = SHA court du commit
        run: echo "TAG=$(echo '${{ gitea.sha }}' | cut -c1-7)" >> "$GITHUB_ENV"

      - name: Construction de l'image
        run: docker build --pull -t "$IMAGE:$TAG" .

      - name: Analyse de sécurité (bloquante sur CRITICAL)
        run: trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE:$TAG"

      - name: Connexion au registre
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "$REGISTRY" -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Publication
        run: |
          docker push "$IMAGE:$TAG"
          docker tag "$IMAGE:$TAG" "$IMAGE:latest"
          docker push "$IMAGE:latest"
          echo "Image publiée : $IMAGE:$TAG"

      - name: Déconnexion
        if: always()
        run: docker logout "$REGISTRY"
