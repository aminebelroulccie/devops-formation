# Livraison d'une version — API Formini Node, en dépôt autonome
#
#   git tag -a v1.0.0 -m "Première version livrée" && git push origin v1.0.0

name: Release

on:
  push:
    tags: ['v*']

env:
  REGISTRY: gitea.formini.local:3000
  IMAGE: gitea.formini.local:3000/equipe-a/formini-node-api
  VERSION: ${{ gitea.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # On ne livre jamais sans tests : mêmes étapes que le job test de ci.yml.

      # Node est installé sur la VM (il fait tourner act_runner) : npm directement.
      - name: Dépendances
        working-directory: .
        run: npm ci --no-audit --no-fund

      - name: Vérification syntaxique
        working-directory: .
        run: node --check server.js

      - name: Tests (node:test)
        working-directory: .
        run: npm test

      - name: Audit des dépendances (informatif)
        working-directory: .
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Construction de l'image
        run: docker build --pull -t "$IMAGE:$VERSION" .

      - name: Analyse de sécurité
        run: trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE:$VERSION"

      - name: Connexion au registre
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "$REGISTRY" -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Publication
        run: |
          docker push "$IMAGE:$VERSION"
          echo "Version $VERSION publiée : $IMAGE:$VERSION"

      - name: Déconnexion
        if: always()
        run: docker logout "$REGISTRY"
