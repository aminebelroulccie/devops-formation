# Livraison d'une version — pile Formini Rust
#
# Déclenché par un tag Git qui commence par "v" (v1.0.0, v1.2.3…).
# Les deux images (API et front) sont étiquetées avec le nom du tag.
#
#   git tag -a v1.0.0 -m "Première version livrée"
#   git push origin v1.0.0

name: Release

on:
  push:
    tags: ['v*']

env:
  REGISTRY: gitea.formini.local:3000
  IMAGE_API: gitea.formini.local:3000/equipe-a/formini-rust-api
  IMAGE_FRONT: gitea.formini.local:3000/equipe-a/formini-rust-frontend
  VERSION: ${{ gitea.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # On ne livre jamais sans tests : mêmes étapes que le job api de ci.yml.

      # Pas de Rust sur la VM : image officielle via docker run. Deux volumes nommés servent
      # de cache (registre des crates, dossier target) : 5 à 10 min au 1er run, < 1 min ensuite.
      - name: Format, clippy et tests (conteneur rust)
        run: |
          docker run --rm -v "$PWD/api:/src" -w /src \
            -v formini-cargo-registry:/usr/local/cargo/registry -v formini-rust-target:/src/target \
            rust:1.83-slim sh -ec '
              rustup component add rustfmt clippy >/dev/null
              cargo fmt --check || echo "rustfmt propose des changements (informatif)"
              cargo clippy --release
              cargo test --release'

      - name: Construction des images
        run: |
          docker build --pull -t "$IMAGE_API:$VERSION" api
          docker build --pull -t "$IMAGE_FRONT:$VERSION" frontend

      - name: Analyse de sécurité
        run: |
          trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE_API:$VERSION"
          trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE_FRONT:$VERSION"

      - name: Connexion au registre
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "$REGISTRY" -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Publication
        run: |
          docker push "$IMAGE_API:$VERSION"
          docker push "$IMAGE_FRONT:$VERSION"
          echo "Version $VERSION publiée : $IMAGE_API:$VERSION et $IMAGE_FRONT:$VERSION"

      - name: Déconnexion
        if: always()
        run: docker logout "$REGISTRY"
