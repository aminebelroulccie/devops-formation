# Pipeline d'intégration continue — API Formini Rust, en dépôt autonome
# (ce dossier api/ poussé seul dans Gitea, par exemple equipe-a/formini-rust-api).
#
#   test     : lint + tests unitaires                       (pull request et push sur main)
#   publish  : image → scan trivy → registre Gitea          (push sur main seulement)
#
# Runner en mode HOST (étiquette ubuntu-latest:host). Le test d'intégration de la pile complète
# (PostgreSQL, Redis, front) est dans le pipeline du dépôt monorepo, à la racine de la pile.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: gitea.formini.local:3000
  IMAGE: gitea.formini.local:3000/equipe-a/formini-rust-api

jobs:
  test:
    name: Lint et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pas de Rust sur la VM : image officielle via docker run. Deux volumes nommés servent
      # de cache (registre des crates, dossier target) : 5 à 10 min au 1er run, < 1 min ensuite.
      - name: Format, clippy et tests (conteneur rust)
        run: |
          docker run --rm -v "$PWD/.:/src" -w /src \
            -v formini-cargo-registry:/usr/local/cargo/registry -v formini-rust-target:/src/target \
            rust:1.83-slim sh -ec '
              rustup component add rustfmt clippy >/dev/null
              cargo fmt --check || echo "rustfmt propose des changements (informatif)"
              cargo clippy --release
              cargo test --release'

  publish:
    name: Image — scan et publication
    runs-on: ubuntu-latest
    needs: test
    if: gitea.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Étiquette = SHA court du commit
        run: echo "TAG=$(echo '${{ gitea.sha }}' | cut -c1-7)" >> "$GITHUB_ENV"

      - name: Construction de l'image
        run: docker build --pull -t "$IMAGE:$TAG" .

      - name: Analyse de sécurité (bloquante sur CRITICAL)
        run: trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE:$TAG"

      - name: Connexion au registre
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "$REGISTRY" -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Publication
        run: |
          docker push "$IMAGE:$TAG"
          docker tag "$IMAGE:$TAG" "$IMAGE:latest"
          docker push "$IMAGE:latest"
          echo "Image publiée : $IMAGE:$TAG"

      - name: Déconnexion
        if: always()
        run: docker logout "$REGISTRY"
