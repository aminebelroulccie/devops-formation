# Pipeline d'intégration continue — front React Formini (Rust), en dépôt autonome
# (ce dossier frontend/ poussé seul dans Gitea, par exemple equipe-a/formini-rust-frontend).
#
#   test     : npm ci + tests (vitest) + vite build, artefact dist/   (pull request et push sur main)
#   publish  : image nginx → scan trivy → registre Gitea             (push sur main seulement)
#
# Node est installé sur la VM (il fait tourner act_runner en mode host).

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: gitea.formini.local:3000
  IMAGE: gitea.formini.local:3000/equipe-a/formini-rust-frontend

jobs:
  test:
    name: Tests et construction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances
        run: npm ci --no-audit --no-fund

      # Vitest + Testing Library : l'API est simulée, aucun service à lancer
      - name: Tests
        run: npm test

      - name: Construction (vite build)
        run: npm run build

      - name: Audit des dépendances (informatif)
        continue-on-error: true
        run: npm audit --audit-level=high

      # Le site compilé, téléchargeable depuis la page du run
      - name: Artefact dist/
        uses: actions/upload-artifact@v3
        with:
          name: dist
          path: dist/

  publish:
    name: Image — scan et publication
    runs-on: ubuntu-latest
    needs: test
    if: gitea.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Étiquette = SHA court du commit
        run: echo "TAG=$(echo '${{ gitea.sha }}' | cut -c1-7)" >> "$GITHUB_ENV"

      - name: Construction de l'image
        run: docker build --pull -t "$IMAGE:$TAG" .

      - name: Analyse de sécurité (bloquante sur CRITICAL)
        run: trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE:$TAG"

      # L'image démarre et répond sur /health (sans API derrière : /api/ renverrait 502, normal)
      - name: Test de démarrage de l'image
        run: |
          docker run -d --rm --name front-$TAG -p 0:8080 "$IMAGE:$TAG"
          PORT=$(docker port front-$TAG 8080 | head -1 | awk -F: '{print $NF}')
          for i in $(seq 1 15); do curl -fsS "http://127.0.0.1:$PORT/health" && break; sleep 1; done
          docker stop front-$TAG

      - name: Connexion au registre
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "$REGISTRY" -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Publication
        run: |
          docker push "$IMAGE:$TAG"
          docker tag "$IMAGE:$TAG" "$IMAGE:latest"
          docker push "$IMAGE:latest"
          echo "Image publiée : $IMAGE:$TAG"

      - name: Déconnexion
        if: always()
        run: docker logout "$REGISTRY"
