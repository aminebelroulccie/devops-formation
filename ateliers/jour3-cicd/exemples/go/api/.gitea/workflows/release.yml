# Livraison d'une version — API Formini Go, en dépôt autonome
#
#   git tag -a v1.0.0 -m "Première version livrée" && git push origin v1.0.0

name: Release

on:
  push:
    tags: ['v*']

env:
  REGISTRY: gitea.formini.local:3000
  IMAGE: gitea.formini.local:3000/equipe-a/formini-go-api
  VERSION: ${{ gitea.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # On ne livre jamais sans tests : mêmes étapes que le job test de ci.yml.

      # Pas de Go sur la VM : on utilise l'image officielle via docker run. Le cache des
      # modules est un volume Docker nommé, conservé d'un run à l'autre (rapide dès le 2e run).
      - name: Format, vet et tests (conteneur golang)
        run: |
          docker run --rm -v "$PWD/.:/src" -w /src -v formini-go-mod:/go/pkg/mod \
            golang:1.23-alpine sh -ec '
              go mod tidy
              echo "Fichiers que gofmt reformaterait (informatif) :"; gofmt -l . || true
              go vet ./...
              go test ./... -v'

      - name: Construction de l'image
        run: docker build --pull -t "$IMAGE:$VERSION" .

      - name: Analyse de sécurité
        run: trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE:$VERSION"

      - name: Connexion au registre
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "$REGISTRY" -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Publication
        run: |
          docker push "$IMAGE:$VERSION"
          echo "Version $VERSION publiée : $IMAGE:$VERSION"

      - name: Déconnexion
        if: always()
        run: docker logout "$REGISTRY"
