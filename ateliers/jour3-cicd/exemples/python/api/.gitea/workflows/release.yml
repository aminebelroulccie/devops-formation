# Livraison d'une version — API Formini Python, en dépôt autonome
#
#   git tag -a v1.0.0 -m "Première version livrée" && git push origin v1.0.0

name: Release

on:
  push:
    tags: ['v*']

env:
  REGISTRY: gitea.formini.local:3000
  IMAGE: gitea.formini.local:3000/equipe-a/formini-python-api
  VERSION: ${{ gitea.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # On ne livre jamais sans tests : mêmes étapes que le job test de ci.yml.

      # python3 est installé sur la VM (mode host) : un venv, comme pour le fil rouge.
      - name: Dépendances
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r ./requirements.txt -r ./requirements-dev.txt

      - name: Lint
        run: .venv/bin/flake8 .

      - name: Tests
        working-directory: .
        run: $GITHUB_WORKSPACE/.venv/bin/pytest -q

      - name: Audit des dépendances (informatif)
        continue-on-error: true
        run: |
          .venv/bin/pip install -q pip-audit
          .venv/bin/pip-audit -r ./requirements.txt

      - name: Construction de l'image
        run: docker build --pull -t "$IMAGE:$VERSION" .

      - name: Analyse de sécurité
        run: trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE:$VERSION"

      - name: Connexion au registre
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "$REGISTRY" -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Publication
        run: |
          docker push "$IMAGE:$VERSION"
          echo "Version $VERSION publiée : $IMAGE:$VERSION"

      - name: Déconnexion
        if: always()
        run: docker logout "$REGISTRY"
