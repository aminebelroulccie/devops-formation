# Bonus : mise à l'échelle automatique.
# Prérequis sur kind : metrics-server (voir README, section bonus).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tasks
  namespace: formini-tasks
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tasks
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
