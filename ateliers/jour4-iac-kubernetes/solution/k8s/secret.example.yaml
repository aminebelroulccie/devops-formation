# Copier en secret.yaml, changer la valeur, NE PAS commiter secret.yaml.
# Alternative sans fichier :
#   kubectl -n formini-tasks create secret generic tasks-secret \
#     --from-literal=POSTGRES_PASSWORD='un-vrai-mot-de-passe'
apiVersion: v1
kind: Secret
metadata:
  name: tasks-secret
  namespace: formini-tasks
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-moi
