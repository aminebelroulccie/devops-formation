# Base de données : un StatefulSet, pas un Deployment.
# Ce qu'il apporte à une base de données :
#   - un nom de pod stable (postgres-0) et une entrée DNS stable (postgres-0.postgres) ;
#   - un volume par réplique, créé automatiquement (volumeClaimTemplates → PVC data-postgres-0),
#     qui SURVIT à la suppression du StatefulSet ;
#   - un démarrage et un arrêt ordonnés, jamais deux pods sur le même volume.
# (En production : opérateur PostgreSQL ou service managé type RDS, mais toujours un StatefulSet dessous.)
apiVersion: v1
kind: Service
metadata:
  name: postgres            # => DNS "postgres" dans le namespace (et postgres-0.postgres)
  namespace: formini-tasks
spec:
  clusterIP: None           # service "headless" : le DNS pointe directement sur le pod
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: formini-tasks
spec:
  serviceName: postgres     # le Service headless qui donne leur identité aux pods
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432, name: postgres }]
          env:
            - name: POSTGRES_USER
              value: formini
            - name: POSTGRES_DB
              value: tasks
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: tasks-secret, key: POSTGRES_PASSWORD }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: [pg_isready, -U, formini, -d, tasks]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, formini, -d, tasks]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
  # Un PVC par pod, nommé <template>-<pod> : data-postgres-0.
  # kubectl delete statefulset postgres ne le supprime PAS : les données restent.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
