#cloud-config
# Préparation minimale d'un nœud pour Kubespray. Kubespray installe tout le reste.
hostname: ${hostname}
manage_etc_hosts: true
package_update: true
packages:
  - python3          # requis par Ansible (déjà présent sur Ubuntu cloud, par sécurité)
  - conntrack
  - socat
runcmd:
  # kubelet refuse de démarrer avec du swap : on le désactive durablement
  - swapoff -a
  - sed -i.bak '/\sswap\s/s/^/#/' /etc/fstab
  # modules et sysctl réseau attendus par Kubernetes (Kubespray les pose aussi)
  - modprobe br_netfilter overlay
  - printf 'br_netfilter\noverlay\n' > /etc/modules-load.d/k8s.conf
  - printf 'net.bridge.bridge-nf-call-iptables=1\nnet.bridge.bridge-nf-call-ip6tables=1\nnet.ipv4.ip_forward=1\n' > /etc/sysctl.d/99-k8s.conf
  - sysctl --system
