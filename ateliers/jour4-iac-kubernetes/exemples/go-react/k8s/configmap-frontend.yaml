# ConfigMap du front : la configuration nginx (même contenu que frontend/nginx.conf et
# frontend/proxy-params.conf). Montée par frontend.yaml PAR-DESSUS les fichiers de l'image :
# on change un timeout ou une route sans reconstruire l'image.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: formini-go
  labels: { app: frontend }
data:
  nginx.conf: |
    # Front Formini : fichiers statiques + passerelle vers l'API.
    # /api/…  → http://api:8080/api/…   (le nom "api" est résolu par le DNS interne de Compose)
    server {
        listen       8080;
        server_name  _;
        root         /usr/share/nginx/html;
        index        index.html;

        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location /api/ {
            proxy_pass http://api:8080/api/;
            include /etc/nginx/proxy-params.conf;
        }

        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
  proxy-params.conf: |
    # En-têtes transmis aux API et délais courts : une API en panne doit échouer vite.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout    10s;
