# Front React servi par nginx : Deployment (2 répliques) + Service NodePort 30081.
# nginx relaie /api/ vers http://api:8080/ : "api" est résolu par le DNS du cluster.
# La configuration nginx vient du ConfigMap frontend-config (elle remplace celle de l'image) :
# on peut la modifier sans reconstruire l'image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: formini-go
  labels: { app: frontend }
  annotations:
    kubernetes.io/change-cause: "v1.0.0 - déploiement initial"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      # initContainer : attend que l'API réponde sur /health avant de lancer nginx
      # (sinon nginx démarre quand même, mais les premières requêtes /api/ renverraient 502).
      initContainers:
        - name: wait-for-api
          image: busybox:1.36
          command: [sh, -c]
          args:
            - |
              until wget -qO- http://api:8080/health >/dev/null 2>&1; do
                echo "en attente de l'API (api:8080)…"; sleep 2
              done
              echo "API prête"
          resources:
            requests: { cpu: 10m, memory: 8Mi }
            limits:   { cpu: 50m, memory: 32Mi }
      containers:
        - name: nginx
          image: gitea.formini.local:3000/equipe-a/formini-go-frontend:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/proxy-params.conf
              subPath: proxy-params.conf
              readOnly: true
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
      volumes:
        - name: nginx-config
          configMap:
            name: frontend-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: formini-go
  labels: { app: frontend }
spec:
  type: NodePort
  selector: { app: frontend }
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30081       # mappé sur http://localhost:8081 par kind-config.yaml
