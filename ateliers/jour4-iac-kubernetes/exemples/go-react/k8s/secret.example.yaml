# Copier en secret.yaml, changer la valeur, NE PAS commiter secret.yaml (il est dans .gitignore).
# Alternative sans fichier :
#   kubectl -n formini-go create secret generic go-secret \
#     --from-literal=POSTGRES_PASSWORD='un-vrai-mot-de-passe' \
#     --from-literal=REDIS_PASSWORD='un-autre-mot-de-passe'
apiVersion: v1
kind: Secret
metadata:
  name: go-secret
  namespace: formini-go
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-moi
  REDIS_PASSWORD: change-moi-aussi
