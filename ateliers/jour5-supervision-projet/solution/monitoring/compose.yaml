# Pile de supervision Formini Tasks — Jour 5
#
# Prérequis : l'application du jour 2 tourne déjà
#   cd ~/formini-tasks && docker compose up -d        (projet "formini-tasks")
# Elle crée le réseau "formini-tasks_default" que cette pile rejoint
# pour atteindre le service "web" par son nom.
#
# Démarrage :  docker compose up -d
# Prometheus : http://<IP-VM>:9090
# Grafana    : http://<IP-VM>:3001   (admin / formini)
# cAdvisor   : http://<IP-VM>:8081
# node_exp.  : http://<IP-VM>:9100/metrics

name: monitoring

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle          # curl -X POST :9090/-/reload
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prom-data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # pour scraper le NodePort kind (8080)
    networks: [monitoring, app]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: formini
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_PORT: "3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"                 # 3000 est utilisé par Gitea
    depends_on: [prometheus]
    networks: [monitoring]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"
    networks: [monitoring]
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8081:8080"
    networks: [monitoring]
    restart: unless-stopped

networks:
  monitoring:
  app:
    external: true
    name: formini-tasks_default     # réseau créé par le compose de l'application

volumes:
  prom-data:
  grafana-data:
