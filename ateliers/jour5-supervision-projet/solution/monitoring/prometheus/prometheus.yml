# Configuration Prometheus — Formini Tasks (Jour 5)
global:
  scrape_interval: 15s        # fréquence de collecte
  evaluation_interval: 15s    # fréquence d'évaluation des règles d'alerte

rule_files:
  - alerts.yml

scrape_configs:
  # Prometheus se surveille lui-même
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # L'application lancée avec Docker Compose (jour 2) : service "web"
  - job_name: formini-tasks
    metrics_path: /metrics
    static_configs:
      - targets: ["web:5000"]
        labels:
          env: compose

  # L'application déployée sur le cluster kind (jour 4), via le NodePort
  # Décommenter quand le cluster tourne.
  # - job_name: formini-tasks-k8s
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["host.docker.internal:8080"]
  #       labels:
  #         env: kind

  # La machine virtuelle
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Les conteneurs Docker
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
