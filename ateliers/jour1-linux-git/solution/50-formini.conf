# Durcissement SSH — à placer dans /etc/ssh/sshd_config.d/50-formini.conf
# Tester avec : sudo sshd -t   puis : sudo systemctl restart ssh
PasswordAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
KbdInteractiveAuthentication no
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
ClientAliveInterval 300
ClientAliveCountMax 2
