# Configuration nginx pour une SPA : fichiers statiques, repli sur index.html, route /health.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # cache long pour les assets fingerprintés par Vite (hash dans le nom)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # sonde de vie, sans toucher au disque
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # toute autre URL → index.html (routage côté client)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
