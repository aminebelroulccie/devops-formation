# Front Formini : fichiers statiques + passerelle vers l'API.
# /api/…  → http://api:8080/api/…   (le nom "api" est résolu par le DNS interne de Compose)
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api:8080/api/;
        include /etc/nginx/proxy-params.conf;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
