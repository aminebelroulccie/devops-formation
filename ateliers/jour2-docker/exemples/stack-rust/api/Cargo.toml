[package]
name = "api-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
tiny_http = "0.12"
postgres = { version = "0.19", features = ["with-chrono-0_4"] }
redis = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
