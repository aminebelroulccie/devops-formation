# Formini Tasks — application + PostgreSQL
# Lancer :  cp .env.example .env && docker compose up -d --build
services:
  web:
    build: .
    image: formini-tasks:dev
    ports:
      - "8000:5000"
    environment:
      DATABASE_URL: postgresql://formini:${POSTGRES_PASSWORD}@db:5432/tasks
      APP_VERSION: ${APP_VERSION:-dev}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: formini
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tasks
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formini -d tasks"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
